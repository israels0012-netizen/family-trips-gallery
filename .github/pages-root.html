<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>family-trips-gallery</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(900px 600px at 30% -10%, #1b2a55, #080b11 60%);
    color: #e8ecf6; font-family: system-ui, "Segoe UI", "Noto Sans Hebrew", sans-serif;
    padding: 24px;
  }
  .card { max-width: 480px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: #95a0bb; line-height: 1.6; margin: 0 0 22px; }
  a {
    display: inline-block; padding: 13px 26px; border-radius: 12px;
    background: linear-gradient(135deg, #5b8cff, #8b5bff);
    color: #fff; text-decoration: none; font-weight: 600; font-size: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🥽 VR Player</h1>
    <p>נגן שמתאים כל סרטון שמעלים וכל קישור שמדביקים למשקפי VR.</p>
    <a href="./vr/">פתיחת הנגן</a>
  </div>
</body>
</html>
