name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on once by a repo owner (Settings -> Pages ->
      # Source: "GitHub Actions"). A workflow token is not allowed to do it:
      # `enablement: true` here fails with "Resource not accessible by
      # integration". After that one-time switch this runs on its own.
      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' ./ _site/
          # Until the gallery itself lives at the root, send visitors to the player.
          if [ ! -f _site/index.html ]; then
            cp .github/pages-root.html _site/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
